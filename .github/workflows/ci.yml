name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:web
        env:
          EXPO_PUBLIC_APP_NAME: CI
          EXPO_PUBLIC_APP_SCHEME: azkaban
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database-and-e2e:
    runs-on: ubuntu-latest
    env:
      # The demo values every local Supabase prints; not secrets.
      EXPO_PUBLIC_APP_NAME: CI
      EXPO_PUBLIC_APP_SCHEME: azkaban
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:test
      - run: pnpm db:check-permissions
      - run: cp supabase/functions/.env.example supabase/functions/.env
      - run: nohup pnpm exec supabase functions serve > /tmp/functions.log 2>&1 &
      - name: Wait for the function
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54421/functions/v1/materialize-occurrences)
            [ "$status" = 200 ] && exit 0
            sleep 2
          done
          cat /tmp/functions.log
          exit 1
      - run: pnpm functions:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
