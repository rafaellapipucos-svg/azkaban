packages:
  - apps/*
  - packages/*
  - packages/features/*

# ponytail: hoisted keeps Metro and native modules predictable (ADR-0002)
nodeLinker: hoisted

catalog:
  react: 19.3.0
  react-native: 0.88.1
  '@types/react': ~19.3.0
  typescript: ~6.0.3
  zod: ^4.6.7
  vitest: ^5.0.5
  i18next: ^26.6.0
  react-i18next: ^16.0.0
  '@supabase/supabase-js': ^2.100.0
  rrule: ^2.8.1

minimumReleaseAgeExclude:
  - i18next@26.6.0
